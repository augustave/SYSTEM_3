name: Validate ontology

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check ontology
        run: node --check ontology.js
      - name: Validate ontology structure
        run: node validate-ontology.js
